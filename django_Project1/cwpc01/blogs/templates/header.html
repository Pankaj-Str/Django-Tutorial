<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Header</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        header{
            background:#0d6efd;
            color:white;
            padding:15px 50px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .logo{
            font-size:28px;
            font-weight:bold;
        }

        nav ul{
            list-style:none;
            display:flex;
            gap:25px;
        }

        nav ul li a{
            text-decoration:none;
            color:white;
            font-size:18px;
            transition:0.3s;
        }

        nav ul li a:hover{
            color:yellow;
        }

        .btn{
            background:white;
            color:#0d6efd;
            padding:10px 18px;
            text-decoration:none;
            border-radius:5px;
            font-weight:bold;
        }

        .btn:hover{
            background:#f1f1f1;
        }

        /* Responsive */
        @media(max-width:768px){

            header{
                flex-direction:column;
                gap:15px;
            }

            nav ul{
                flex-direction:column;
                text-align:center;
            }
        }
    </style>

</head>
<body>

    <header>

        <div class="logo">My Website</div>

        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Courses</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>

        <a href="{% url 'employee_form' %}"><button class="btn">Add New Employee</button></a>
       
       

    </header>

</body>
</html>
