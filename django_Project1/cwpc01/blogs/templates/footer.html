<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Footer</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        footer{
            background:#0d6efd;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:50px;
        }

        footer p{
            margin-bottom:10px;
        }

        .footer-links a{
            color:white;
            text-decoration:none;
            margin:0 10px;
            transition:0.3s;
        }

        .footer-links a:hover{
            color:yellow;
        }

        .social-icons{
            margin-top:15px;
        }

        .social-icons a{
            color:white;
            text-decoration:none;
            margin:0 10px;
            font-size:18px;
        }

        .social-icons a:hover{
            color:yellow;
        }
    </style>
</head>
<body>

    <!-- Website Content -->

    <footer>

        <p>&copy; 2026 My Website. All Rights Reserved.</p>

        <div class="footer-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
            <a href="#">Privacy Policy</a>
        </div>

        <div class="social-icons">
            <a href="#">Facebook</a> |
            <a href="#">Instagram</a> |
            <a href="#">LinkedIn</a> |
            <a href="#">YouTube</a>
        </div>

    </footer>

</body>
</html>
